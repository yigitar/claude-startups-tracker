name: Check Claude Startups

on:
  schedule:
      - cron: '*/5 * * * *'
        workflow_dispatch:

        jobs:
          check:
              runs-on: ubuntu-latest
                  steps:
                        - name: Check application pages
                                env:
                                          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                                                    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                                                            run: |
                                                                      CHANGED=false
                                                                                DETAILS=""

                                                                                          check_page() {
                                                                                                      local url="$1"
                                                                                                                  local name="$2"
                                                                                                                              local body
                                                                                                                                          body=$(curl -sL -A "Mozilla/5.0" -m 30 "$url")
                                                                                                                                                      local final_url
                                                                                                                                                                  final_url=$(curl -sL -o /dev/null -w '%{url_effective}' -A "Mozilla/5.0" -m 30 "$url")
                                                                                                                                                                  
                                                                                                                                                                              if echo "$body" | grep -qi "apply now\|start.application\|application.form\|submit.your.application"; then
                                                                                                                                                                                            CHANGED=true
                                                                                                                                                                                                          DETAILS="${DETAILS}\n✅ ${name}: BASVURU ACIK OLABILIR! (${final_url})"
                                                                                                                                                                                                                      elif echo "$body" | grep -qi "cohort is now full\|not accepting"; then
                                                                                                                                                                                                                                    DETAILS="${DETAILS}\n❌ ${name}: Kapali (${final_url})"
                                                                                                                                                                                                                                                else
                                                                                                                                                                                                                                                              CHANGED=true
                                                                                                                                                                                                                                                                            DETAILS="${DETAILS}\n⚠️ ${name}: Bilinmeyen icerik! (${final_url})"
                                                                                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                            check_page "https://platform.claude.com/offers/startups-application" "Platform Basvuru"
                                                                                                                                                                                                                                                                                                                      check_page "https://claude.com/programs/startups" "Startups Program"
                                                                                                                                                                                                                                                                                                                                check_page "https://claude.com/contact-sales/vc-partner" "VC Partner"
                                                                                                                                                                                                                                                                                                                                          check_page "https://claude.com/contact-sales/yc-credit" "YC Credit"
                                                                                                                                                                                                                                                                                                                                                    check_page "https://www.anthropic.com/startups" "Anthropic Startups"
                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                              LINKS="Basvuru linkleri:"
                                                                                                                                                                                                                                                                                                                                                                        LINKS="${LINKS}\n1. https://platform.claude.com/offers/startups-application"
                                                                                                                                                                                                                                                                                                                                                                                  LINKS="${LINKS}\n2. https://claude.com/programs/startups"
                                                                                                                                                                                                                                                                                                                                                                                            LINKS="${LINKS}\n3. https://claude.com/contact-sales/vc-partner"
                                                                                                                                                                                                                                                                                                                                                                                                      LINKS="${LINKS}\n4. https://claude.com/contact-sales/yc-credit"
                                                                                                                                                                                                                                                                                                                                                                                                                LINKS="${LINKS}\n5. https://www.anthropic.com/startups"
                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                          if [ "$CHANGED" = true ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                      MSG="🚨 CLAUDE STARTUPS DEGISIKLIK!\n\n$(echo -e "$DETAILS")\n\n$(echo -e "$LINKS")"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                -d chat_id="${TELEGRAM_CHAT_ID}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              -d text="$(echo -e "$MSG")" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            -d parse_mode=""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo -e "$DETAILS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "changed=$CHANGED"
