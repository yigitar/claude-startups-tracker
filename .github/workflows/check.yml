name: Check Claude Startups

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check application pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import urllib.request, json, sys, ssl

          URLS = [
              ('Platform Basvuru', 'https://platform.claude.com/offers/startups-application'),
              ('Startups Program', 'https://claude.com/programs/startups'),
              ('VC Partner', 'https://claude.com/contact-sales/vc-partner'),
              ('YC Credit', 'https://claude.com/contact-sales/yc-credit'),
              ('Anthropic Startups', 'https://www.anthropic.com/startups'),
          ]

          CLOSED = ['cohort is now full', 'not accepting']
          OPEN = ['apply now', 'start application', 'application form', 'submit your application']
          BOT = '$TELEGRAM_BOT_TOKEN'
          CHAT = '$TELEGRAM_CHAT_ID'

          ctx = ssl.create_default_context()
          changed = False
          details = []

          for name, url in URLS:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      body = r.read().decode('utf-8', 'replace').lower()
                      final = r.url
                  if any(m in body for m in OPEN):
                      changed = True
                      details.append(f'✅ {name}: BASVURU ACIK OLABILIR! ({final})')
                  elif any(m in body for m in CLOSED):
                      details.append(f'❌ {name}: Kapali ({final})')
                  else:
                      changed = True
                      details.append(f'⚠️ {name}: Bilinmeyen icerik! ({final})')
              except Exception as e:
                  changed = True
                  details.append(f'⚠️ {name}: Hata: {str(e)[:80]}')

          report = chr(10).join(details)
          print(report)

          if changed:
              links = chr(10).join([f'{i+1}. {u[1]}' for i, u in enumerate(URLS)])
              msg = f'🚨 CLAUDE STARTUPS DEGISIKLIK!{chr(10)}{chr(10)}{report}{chr(10)}{chr(10)}Basvuru linkleri:{chr(10)}{links}'
              data = urllib.parse.urlencode({'chat_id': CHAT, 'text': msg}).encode()
              import urllib.parse
              data = urllib.parse.urlencode({'chat_id': CHAT, 'text': msg}).encode()
              req2 = urllib.request.Request(f'https://api.telegram.org/bot{BOT}/sendMessage', data=data)
              urllib.request.urlopen(req2, timeout=10, context=ctx)
              print('Telegram bildirim gonderildi')
          else:
              print('Degisiklik yok')
          "
